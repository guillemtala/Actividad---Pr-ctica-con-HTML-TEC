<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <header class="bg-dark text-white p-3 mb-4 text-center">
        <h1 class="h3">Mi Sitio Web</h1>
        <nav class="nav justify-content-center">
            <a class="nav-link text-white active fw-bold" href="index.html">Login</a>
            <a class="nav-link text-white-50" href="profile.html">Perfil</a>
            <a class="nav-link text-white-50" href="tags.html">Etiquetas</a>
        </nav>
    </header>

    <div class="container" style="max-width: 400px;">
        <h2 class="h4 mb-3">Iniciar Sesión</h2>
        <form action="profile.html" method="get">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario:</label><br />
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <br />
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña:</label><br />
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <br />
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
