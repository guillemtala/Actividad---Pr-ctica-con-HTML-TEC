<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <header class="bg-dark text-white p-3 mb-4 text-center">
        <h1 class="h3">Mi Sitio Web</h1>
        <nav class="nav justify-content-center">
            <a class="nav-link text-white active fw-bold" href="index.html">Login</a>
            <a class="nav-link text-white-50" href="profile.html">Perfil</a>
            <a class="nav-link text-white-50" href="tags.html">Etiquetas</a>
            <a class="nav-link text-white-50" href="formulario.html">Formulario</a>
        </nav>
    </header>

    <div class="container my-4" style="max-width: 500px;">
        <div class="card shadow-sm p-4 mb-4">
            <h2 class="h4 mb-3 text-center">Iniciar Sesión</h2>
            <p class="text-center text-muted small mb-3">Conectado a REST API en <span id="api-status-badge" class="badge bg-secondary">Verificando...</span></p>
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario o Email:</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ingresa usuario (ej. admin o juan)" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa contraseña (ej. admin123 o juan123)" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-2">Entrar</button>
            </form>
            <div id="login-alert" class="alert d-none mt-2" role="alert"></div>
        </div>

        <div class="card shadow-sm p-4">
            <h3 class="h5 mb-3 text-center">Acciones Interactivas de JS</h3>
            <div class="d-grid gap-2">
                <button type="button" id="btn-color" class="btn btn-outline-dark">Cambiar Color de Fondo</button>
                <button type="button" id="btn-fecha" class="btn btn-outline-info">Mostrar Fecha y Hora Actual</button>
                <p id="fecha-output" class="text-center fw-bold text-secondary my-1"></p>
                <button type="button" id="btn-saludo" class="btn btn-outline-success">Generar Saludo Dinámico</button>
                <p id="saludo-output" class="text-center fw-bold text-success my-1"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
